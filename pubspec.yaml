name: ethiopian_calendar
description: Ethiopian Calendar & Date Converter — offline-first calendar and date conversion app.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.3
  shared_preferences: ^2.5.3
  ethiopian_date_picker: ^0.0.7
  go_router: ^16.0.0
  intl: ^0.20.2
  share_plus: ^11.0.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  change_app_package_name: ^1.5.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_icon.png
